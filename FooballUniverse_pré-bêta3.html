function player(club,ovr,idx){let age=18+rnd(17),pos=POS[idx%POS.length],potential=clamp(ovr+rnd(19)-3,ovr,95);let p={id:crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2,14),name:FIRST[rnd(FIRST.length)]+' '+LAST[rnd(LAST.length)],pos,ovr:clamp(ovr+rnd(9)-4,48,91),potential,age,form:55+rnd(36),energy:75+rnd(26),moral:60+rnd(36),contract:1+rnd(5),wage:0,apps:0,goals:0,assists:0,clubId:club.id};p.value=calcValue(p,club);p.wage=Math.max(500,Math.round(((p.ovr-45)**2*20+p.value*.0015)/1000)*1000);return p}

function calcValue(p,club){
  // Estimation inspirée des critères de marché : niveau, âge, potentiel, poste,
  // championnat, forme et production. Ce n'est pas une valeur officielle Transfermarkt.
  const rating=clamp(Number(p.ovr)||50,40,99);
  const potential=clamp(Number(p.potential)||rating,rating,99);
  const age=Math.max(15,Number(p.age)||25);
  const ageCoeff=age<=18?1.42:age<=20?1.38:age<=23?1.28:age<=26?1.16:age<=29?1.02:age<=31?.88:age<=33?.73:.62;

  const potentialCoeff=1+Math.min(20,potentialGap)*.025;
  const positionCoeff=({BU:1.12,AD:1.10,AG:1.10,MOC:1.08,MC:1.03,MDC:1.02,DC:1.00,DD:.96,DG:.96,G:.88,GB:.88})[p.pos]||1;

  const base=50000000*Math.pow(rating/80,8);
  const value=base*ageCoeff*potentialCoeff*positionCoeff*leagueCoeff*formCoeff*productionCoeff;

function expandPlayerName(name){

    const words=full.trim().split(/\s+/);
    return words[0].charAt(0).toLocaleUpperCase()===initial && full.toLocaleLowerCase().endsWith(surname);
  });
  return matches.length===1?matches[0]:name;
}

function renewPlayer(playerId){let c=club(),p=c.players.find(x=>x.id===playerId);if(!p)return;const activeLoan=(state.loans||[]).find(l=>l.playerId===p.id&&l.toId===c.id);if(activeLoan){toast('Impossible de prolonger depuis ce club : le joueur est prêté.');return}let yearsRaw=prompt(`Prolonger le contrat de ${p.name}.

function renderOffers(){let items=state.offers.slice().reverse();$('#transferContent').innerHTML=items.length?items.map(o=>{let p=allPlayers().find(x=>x.id===o.playerId);let low=Math.max(100000,Math.round((o.value||o.ask)*.35/100000)*100000),high=Math.max(low+100000,Math.round((o.ask||o.value)*1.2/100000)*100000),current=clamp(Number(o.offer)||low,low,high);return `<div class="panel" style="margin-bottom:10px"><div class="topline"><div><h3>${esc(o.playerName)}</h3><div class="muted">${esc(o.from)} → ${esc(club().name)} · Valeur estimée : ${money(o.value)}</div></div><span class="badge">${o.status==='pending'?'En négociation':o.status==='accepted'?'Transfert accepté':o.status==='rejected'?'Refusée':'Clôturée'}</span></div><p>Prix demandé par le club : <strong>${money(o.ask)}</strong></p>${o.status==='pending'?`<div class="offer-slider-wrap" style="padding:14px;background:#0a192b;border:1px solid #294361;border-radius:12px;margin:12px 0"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><label for="offerRange-${o.id}"><strong>Ton offre de transfert</strong></label><strong id="offerValue-${o.id}" class="rating">${money(current)}</strong></div><input id="offerRange-${o.id}" data-offer-range="${o.id}" type="range" min="${low}" max="${high}" step="100000" value="${current}" style="width:100%;margin:15px 0;accent-color:#3b82f6;cursor:pointer"><div class="small muted" style="display:flex;justify-content:space-between"><span>Bas · ${money(low)}</span><span>Haut · ${money(high)}</span></div><div class="bar" style="height:8px"><i id="offerBar-${o.id}" style="width:${Math.round((current-low)/(high-low)*100)}%"></i></div><div class="toolbar"><button data-submit-offer="${o.id}">Proposer ce prix</button><button class="success" data-accept="${o.id}">Accepter le prix demandé</button><button class="danger" data-cancel="${o.id}">Abandonner</button></div><div class="small muted">Déplace le curseur de gauche à droite pour choisir ton prix function goals(attack,defense,home){

  const lambda=clamp(1.32*Math.exp(diff/26)+(home?0.20:0),0.18,3.25);
  const limit=Math.exp(-lambda);let product=1,k=0;
  do{ k++; product*=Math.random(); }while(product>limit&&k<12);
  return k-1;
}

function playChampionsStage(){let e=state.europe,stage=e.championsKnockouts[e.championsKnockouts.length-1];if(!stage||stage.done)return;let teams=stage.teams||[],winners=[];if(stage.name==='Barrages'){for(let i=0;i<8;i++){let a=teams[i],b=teams[15-i];if(!a||!b)continue;let a1=goals(a.strength,b.strength,true),b1=goals(b.strength,a.strength,false),a2=goals(a.strength,b.strength,false),b2=goals(b.strength,a.strength,true),sumA=a1+a2,sumB=b1+b2;if(sumA===sumB){if(Math.random()<.5)sumA++;else sumB++}let win=sumA>sumB?a:b;winners.push(win);stage.ties.push({a:a.name,b:b.name,scoreA:`${a1}-${b1} / ${a2}-${b2}`,scoreB:'',agg:`${sumA}-${sumB}`,winner:win.name})}winners=[...(stage.byes||[]),...winners];}else{for(let i=0;i<teams.length;i+=2){let a=teams[i],b=teams[i+1];if(!a||!b)continue;let a1=goals(a.strength,b.strength,true),b1=goals(b.strength,a.strength,false),a2=stage.legs===2?goals(a.strength,b.strength,false):0,b2=stage.legs===2?goals(b.strength,a.strength,true):0;let sumA=a1+a2,sumB=b1+b2;if(sumA===sumB){if(Math.random()<.5)sumA++;else sumB++}let win=sumA>sumB?a:b;winners.push(win);stage.ties.push({a:a.name,b:b.name,scoreA:stage.legs===2?`${a1}-${b1} / ${a2}-${b2}`:a1,scoreB:stage.legs===2?'':b1,agg:`${sumA}-${sumB}`,winner:win.name})}}stage.done=true;if(winners.length===1){e.championsStage='finished';e.championsChampion=winners[0].name;stage.name='Finale — terminée';addNews(`${winners[0].name} remporte la Champions Cup !`)}else{let nextName=stage.name==='Barrages'?'Huitièmes de finale':winners.length===8?'Quarts de finale':winners.length===4?'Demi-finales':'Finale';e.championsStage=nextName==='Huitièmes de finale'?'round16':nextName==='Quarts de finale'?'quarters':nextName==='Demi-finales'?'semis':'final';e.championsKnockouts.push({name:nextName,legs:nextName==='Finale'?1:2,teams:winners.map(x=>({name:x.name,strength:x.strength,league:x.league})),ties:[],done:false})}save();renderPage()}
function finishEuropaGroups(){let e=state.europe;if(!e.europa.length){toast('Génère d’abord les groupes.');return}if(e.europaStage!=='groups'){toast('La phase de groupes est déjà terminée.');return}let qualified=e.europa.flatMap(g=>g.slice().sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.strength-a.strength).slice(0,2));while(qualified.length<8){qualified.push({name:'Club invité '+(qualified.length+1),league:'Europe',strength:65+rnd(10),pts:0,gf:0,ga:0,played:0})}e.europaStage='quarters';e.europaKnockouts=[{name:'Quarts de finale',legs:2,teams:qualified.map(x=>({name:x.name,strength:x.strength,league:x.league})),ties:[]}];save();renderPage();toast('Les huit qualifiés sont prêts pour les quarts de finale aller-retour.')}
function renderEuropaKnockouts(){let el=$('#europaKnockoutArea');if(!el)return;let e=state.europe;if(!e.europaKnockouts?.length){el.innerHTML='';return}let stage=e.europaKnockouts[e.europaKnockouts.length-1];el.innerHTML=`<div class="notice"><strong>${stage.name}</strong> · ${stage.legs===2?'Aller-retour':'Match unique'}<p class="small">${stage.ties.length?stage.ties.map(t=>`${esc(t.a)} ${t.scoreA}-${t.scoreB} ${esc(t.b)}${t.agg?` · cumul ${t.agg}`:''}`).join('<br>'):'Les confrontations seront simulées en cliquant ci-dessous.'}</p>${stage.ties.length===0?`<button id="playEuropaStage">Jouer ${stage.name.toLowerCase()}</button>`:''}</div>`;let b=$('#playEuropaStage');if(b)b.onclick=()=>playEuropaStage()}
function playEuropaStage(){let e=state.europe,stage=e.europaKnockouts[e.europaKnockouts.length-1];if(!stage||stage.ties.length)return;let teams=stage.teams.slice(),winners=[];for(let i=0;i<teams.length;i+=2){let a=teams[i],b=teams[i+1];if(!b)continue;let a1=goals(a.strength,b.strength,true),b1=goals(b.strength,a.strength,false),a2=stage.legs===2?goals(a.strength,b.strength,false):0,b2=stage.legs===2?goals(b.strength,a.strength,true):0;let sumA=a1+a2,sumB=b1+b2;if(sumA===sumB){if(Math.random()<.5)sumA++;else sumB++}let win=sumA>sumB?a:b;winners.push(win);stage.ties.push({a:a.name,b:b.name,scoreA:stage.legs===2?`${a1}-${b1} / ${a2}-${b2}`:a1,scoreB:stage.legs===2?'':b1,agg:`${sumA}-${sumB}`,winner:win.name})}if(winners.length===1){e.europaStage='finished';e.europaChampion=winners[0].name;stage.name='Finale — terminée';addNews(`${winners[0].name} remporte l’Europa Cup !`)}else{let nextName=winners.length===4?'Demi-finales':winners.length===2?'Finale':'Phase suivante';e.europaKnockouts.push({name:nextName,legs:winners.length===2?1:2,teams:winners.map(x=>({name:x.name,strength:x.strength,league:x.league})),ties:[]});}save();renderPage()}
function importSave(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!data.clubs||!data.clubId||!data.manager)throw Error('invalid');state=data;save();renderGame();toast('Sauvegarde importée.')}catch(err){toast('Fichier de sauvegarde invalide.')}};r.readAsText(f)}
showWelcome();
